[package]
name = "beacon"
version = "0.7.3"
description = "GitHub & GitLab Notification Hub"
authors = ["you"]
edition = "2021"

[lib]
name = "beacon_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSSound", "NSEvent", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString"] }
block2 = "0.6"
# Direct dep so we can call set_icon_with_as_template atomically via
# Tauri's with_inner_tray_icon. Tauri's split set_icon / set_icon_as_template
# has a known race condition that leaves the icon stuck non-template
# (tauri-apps/tauri#9332). Version must match what Tauri pulls in
# transitively (currently 0.21.x).
tray-icon = { version = "0.21", default-features = false }
security-framework = "3"
security-framework-sys = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
